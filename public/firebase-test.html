
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Firebase Connection Test</title>
</head>
<body>
  <h1>Firebase Connection Test</h1>
  <p id="status">Checking configuration...</p>

  
<script type="module">
  import { db } from "/shared/firebase.js";
  import {
    ref,
    onValue
  } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

  const status = document.getElementById("status");

  status.textContent = "Connecting to Firebase...";

  onValue(
    ref(db, ".info/connected"),
    (snapshot) => {
      const connected = snapshot.val();

      status.textContent = connected
        ? "Connected to Firebase Realtime Database."
        : "Firebase initialized; database is disconnected.";

      console.log("Firebase connected:", connected);
    },
    (error) => {
      status.textContent = "Connection error: " + error.message;
      console.error("Firebase connection error:", error);
    }
  );
</script>
</body>
</html>
